templates:
  current_turn: |
    ${table}

    Question: ${question}

    Actions taken so far:
    ${action_history}

    Available operations:
    ${available_operations}

    Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Include every required tool argument. Do not return prose, Markdown, or a function call.
    Next MCP request:
terminology:
  operation_name: MCP tool name
  operation_call: complete MCP tools/call request
operation_shapes:
  select_row: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"select_row","arguments":{"rows":["row 0","row 2"]}}}'
  select_column: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"select_column","arguments":{"columns":["Name","Points"]}}}'
  group_by: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"group_by","arguments":{"column":"Country"}}}'
  sort_by: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"sort_by","arguments":{"column":"Year","order":"desc"}}}'
  end: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"end","arguments":{}}}'
