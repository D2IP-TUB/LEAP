  action_selection:
    # Example 1: Temporal question (last year) - requires extracting year, filtering, and sorting
    - table: " ,date,division,league,regular season,playoffs,open cup,avg. attendance\nrow 0,2001/01/02,2,usl a-league,4th western,quarterfinals,did not qualify,7169\nrow 1,2002/08/06,2,usl a-league,2nd pacific,1st round,did not qualify,6260\nrow 2,2005/03/24,2,usl first division,5th,quarterfinals,4th round,6028"
      question: "What was the last year team was part of the usl a-league?"
      explanation: "The question asks about the 'last year' for a specific league. We need to: 1) Extract year from the date column using add_column, 2) Filter to only usl a-league rows using select_row, 3) Keep relevant columns using select_column, 4) Sort by year to find the last one using sort_by."
      answer: "add_column(year) -> select_row([0, 1]) -> select_column([year, league]) -> sort_by(year, desc) -> end"

    # Example 2: Counting by category - requires extracting country and grouping
    - table: " ,rank,lane,athlete,time\nrow 0,1,6,manjeet kaur (ind),52.17\nrow 1,2,5,olga tereshkova (kaz),51.86\nrow 2,3,4,pinki pramanik (ind),53.06"
      question: "How many athletes are from India?"
      explanation: "The question asks to count athletes from a specific country. We need to: 1) Extract country from athlete names using add_column, 2) Filter to Indian athletes using select_row, 3) Keep relevant columns using select_column, 4) Group by country to count using group_by."
      answer: "add_column(country of athletes) -> select_row([0, 2]) -> select_column([athlete, country of athletes]) -> group_by(country of athletes) -> end"

    # Example 3: Superlative (highest) - requires extracting derived value and sorting
    - table: " ,week,when,kickoff,opponent,results final score,results team record,game site,attendance\nrow 0,1,saturday april 13,7:00 p.m.,at rhein fire,w 27-21,1-0,rheinstadion,32092\nrow 1,2,saturday april 20,7:00 p.m.,london monarchs,w 37-3,2-0,waldstadion,34186\nrow 2,3,sunday april 28,6:00 p.m.,at barcelona dragons,w 33-29,3-0,estadi olimpic de montjuic,17503"
      question: "On what date was the competition held with highest points scored?"
      explanation: "The question asks about the date with the highest points. We need to: 1) Extract total points scored from final score using add_column, 2) Select all rows using select_row, 3) Keep relevant columns using select_column, 4) Sort by points to find the highest using sort_by."
      answer: "add_column(points scored) -> select_row([*]) -> select_column([when, points scored]) -> sort_by(points scored, desc) -> end"

    # Example 4: Counting with filter - requires extracting year and grouping
    - table: " ,iso/iec standard,status,wg\nrow 0,iso/iec tr 19759,published (2005),20\nrow 1,iso/iec 15288,published (2008),7\nrow 2,iso/iec 12207,published (2011),7"
      question: "How many standards were published in 2011?"
      explanation: "The question asks to count standards from a specific year. We need to: 1) Extract year from status using add_column, 2) Filter to 2011 rows using select_row, 3) Keep relevant columns using select_column, 4) Group by year to count using group_by."
      answer: "add_column(year) -> select_row([2]) -> select_column([iso/iec standard, year]) -> group_by(year) -> end"
