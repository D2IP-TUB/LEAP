action_descriptions:
  - description: "If the table does not have the needed column to answer the question, we use f_add_column() to add a new column."
    table_repr: |
      ,rank,lane,player,time
      row 1,1,5,olga tereshkova (kaz),51.86
      row 2,2,6,manjeet kaur (ind),52.17
      row 3,3,3,asami tanno (jpn),53.04
    question: "How many athletes are from Japan?"
    function: 'f_add_column(country of athlete, ["Kazakstan", "India", "Japan"])'
    explanation: "The question asks about the number of athletes from Japan. We need to know the country of each athlete. There is no column for the country of athletes. We add a column country of athlete."

  - description: "If the table only needs a few columns to answer the question, we use f_select_column() to keep only those columns."
    table_repr: |
      ,code,county,former province,area (km2),population,capital
      row 1,1,mombasa,coast,212.5,"939,370",mombasa (city)
      row 2,2,kwale,coast,8270.3,"649,931",kwale
      row 3,3,kilifi,coast,12245.9,"1,109,735",kilifi
    question: "What is the population of Mombasa county?"
    function: "f_select_column(county, population)"
    explanation: "The question asks about the population of Mombasa county. We only need to know the county names and their populations. We select columns county and population."

  - description: "If the table only needs a few rows to answer the question, we use f_select_row() to keep only those rows."
    table_repr: |
      ,years,displacement,engine,power,torque
      row 1,1999 - 2004,4.0l (242cid),power tech i6,-,3000 rpm
      row 2,1999 - 2004,4.7l (287cid),powertech v8,-,3200 rpm
      row 3,2002 - 2004,4.7l (287cid),high output powertech v8,-,-
      row 4,1999 - 2001,3.1l diesel,531 ohv diesel i5,-,-
      row 5,2002 - 2004,2.7l diesel,om647 diesel i5,-,-
    question: "What is the third lowest displacement among Jeep Grand Cherokee engines?"
    function: "f_select_row(row 1, row 4, row 5)"
    explanation: "The question asks for the third lowest displacement value. We need the three rows with the lowest displacement values: row 5 (2.7l), row 4 (3.1l), and row 1 (4.0l). We select row 1, row 4, and row 5."

  - description: "If the question asks about items sharing the same value and the count of those items, we use f_group_by() to group them."
    table_repr: |
      ,district,name,party,residence,first served
      row 1,district 1,nelson albano,dem,vineland,2006
      row 2,district 1,robert andrzejczak,dem,middle twp.,2013
      row 3,district 2,john f. amodeo,rep,margate,2008
    question: "How many representatives belong to each party?"
    function: "f_group_by(party)"
    explanation: "The question asks about the number of representatives from each party. We need to count items sharing the same value in the party column. We group the rows according to column party."

  - description: "If the question asks about the order of items in a column, we use f_sort_by() to sort them."
    table_repr: |
      ,position,club,played,points
      row 1,1,malaga cf,42,79
      row 10,10,cp merida,42,59
      row 3,3,cd numancia,42,73
    question: "Which club placed in the last position?"
    function: "f_sort_by(position, desc)"
    explanation: "The question asks about the club in the last position. We need to know the order of positions from last to first. We sort the rows according to column position."

