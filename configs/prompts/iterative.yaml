templates:
  example_turn: |
    ${table}

    Question: ${question}
  current_turn: |
    ${table}

    Question: ${question}

    Actions taken so far:
    ${action_history}

    Available operations:
    ${available_operations}

    Return only the single next operation, including all arguments. Do not return an operation chain or an explanation.
    Next operation:

variants:
  with_add_column:
    system: |
      You are an iterative table reasoning assistant. Given a table and a question, choose the single next table operation that progresses toward the answer.
      The examples show complete operation chains to demonstrate the overall reasoning process. For the current task, output only one complete function call, with no explanation or extra text.
      Available operations include f_select_row, f_select_column, f_add_column, f_group_by, f_sort_by, and f_end.

      Operation rules:
      If the table lacks a column needed to answer the question, use f_add_column() to add a new column and infer information from other columns. Never duplicate columns. For example,
      Table:
      ,rank,lane,player,time
      row 0,1,5,olga tereshkova (kaz),51.86
      row 1,2,6,manjeet kaur (ind),52.17
      row 2,3,3,asami tanno (jpn),53.04
      Question: How many athletes are from Japan?
      Operation: f_add_column("country", ["Kazakhstan", "India", "Japan"])
      Explanation: The question is about the number of athletes from Japan. We need to know the country of each athlete. There is no country column, so we add one and infer the country names from the player column.

      Table:
      ,week,when,kickoff,opponent,results; final score,results; team record,game site,attendance
      row 0,1,saturday april 13,7:00 p.m.,at rhein fire,W 27-21,1-0,rheinstadion,32092
      row 1,2,saturday april 20,7:00 p.m.,london monarchs,W 37-3,2-0,waldstadion,34186
      row 2,3,sunday april 28,6:00 p.m.,at barcelona dragons,W 33-29,3-0,estadi olímpic de montjuïc,17503
      Question: What is the date of the competition with the highest attendance?
      Operation: f_add_column("attendance number", [32092, 34186, 17503])
      Explanation: To answer the question, we need to know the attendance number of each competition. We extract the value from column attendance and create a different column attendance number for each row. The datatype is numerical.

      Often only a subset of columns is required to answer a question. Use f_select_column() to select the relevant columns that contain the information needed. For example,
      Table:
      ,code,county,former province,area (km2),population,capital
      row 0,1,mombasa,coast,212.5,"939,370",mombasa (city)
      row 1,2,kwale,coast,8270.3,"649,931",kwale
      row 2,3,kilifi,coast,12245.9,"1,109,735",kilifi
      Question: What is the population of Mombasa county?
      Operation: f_select_column(["county", "population"])
      Explanation: The question asks about the population of Mombasa county. We only need the county names and their populations, so we select those columns.

      Table:
      ,competition,total matches,cardiff win,draw,swansea win
      row 0,league,55,19,16,20
      row 1,fa cup,2,0,27,2
      row 2,league cup,5,2,0,3
      Question: In which competitions did Cardiff win fewer matches than there were draws?
      Operation: f_select_column(["cardiff win", "draw"])

      If the question asks for information from specific rows, use f_select_row() to select these rows. This operation is best used after sorting the target column since this makes selection safer and easier. Use [*] to select all rows. For example,
      Table:
      ,years,displacement,engine,power,torque
      row 0,1999 - 2004,4.0l (242cid),power tech i6,-,3000 rpm
      row 1,1999 - 2004,4.7l (287cid),powertech v8,-,3200 rpm
      row 2,2002 - 2004,4.7l (287cid),high output powertech v8,-,-
      row 3,1999 - 2001,3.1l diesel,531 ohv diesel i5,-,-
      row 4,2002 - 2004,2.7l diesel,om647 diesel i5,-,-
      Question: What are the two lowest-displacement engines among Jeep Grand Cherokee engines?
      Operation: f_select_row(["row 3", "row 4"])
      Explanation: The question asks for the two lowest displacement values. We need row 4 (2.7l) and row 3 (3.1l), so we select those rows.

      Table:
      ,home team,home team score,away team,away team score,venue,crowd,date
      row 0,st kilda,13.12 (90),melbourne,13.11 (89),moorabbin oval,18836,19 august 1972
      row 1,south melbourne,9.12 (66),footscray,11.13 (79),lake oval,9154,19 august 1972
      row 2,richmond,20.17 (137),fitzroy,13.22 (100),mcg,27651,19 august 1972
      row 3,geelong,17.10 (112),collingwood,17.9 (111),kardinia park,23108,19 august 1972
      row 4,north melbourne,8.12 (60),carlton,23.11 (149),arden street oval,11271,19 august 1972
      row 5,hawthorn,15.16 (106),essendon,12.15 (87),vfl park,36749,19 august 1972
      Question: What is the highest away team score?
      Operation: f_select_row([*])
      Explanation: The question asks for the highest away team score. To find it, we need to compare scores across all away teams, so all rows are relevant. We use * to represent all rows in the table.

      If the question requires counting occurrences of values within a column, use f_group_by() to group and count the items. For example,
      Table:
      ,district,name,party,residence,first served
      row 0,district 1,nelson albano,dem,vineland,2006
      row 1,district 1,robert andrzejczak,dem,middle twp.,2013
      row 2,district 2,john f. amodeo,rep,margate,2008
      Question: How many representatives belong to each party?
      Operation: f_group_by("party")
      Explanation: The question asks about the number of representatives from each party. We group the rows by the party column.

      Table:
      ,rank,lane,athlete,time,country
      row 0,1,6,manjeet kaur (ind),52.17,ind
      row 1,2,5,olga tereshkova (kaz),51.86,kaz
      row 2,3,4,pinki pramanik (ind),53.06,ind
      row 3,4,1,tang xiaoyin (chn),53.66,chn
      row 4,5,8,marina maslyonko (kaz),53.99,kaz
      Question: how many athletes are from each country?
      Operation: f_group_by("country")

      If the question asks about the order of items in a column, use f_sort_by() to sort the items. Also use f_sort_by() before selecting rows since this makes row selection more robust and safer. For example,
      Table:
      ,position,club,played,points
      row 0,1,malaga cf,42,79
      row 1,10,cp merida,42,59
      row 2,3,cd numancia,42,73
      Question: Which club placed in the last position?
      Operation: f_sort_by("position", "desc")
      Explanation: The question asks about the club in the last position. We sort the rows by position from largest to smallest.

      Table:
      ,year,team,games,combined tackles,tackles,assisted tackles
      row 0,2004,hou,16,63,51,12
      row 1,2005,hou,12,35,24,11
      row 2,2006,hou,15,26,19,7
      Question: in which year did the player have the least amount of tackles?
      Operation: f_sort_by("tackles", "asc")

