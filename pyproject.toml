[project]
name = "leap"
version = "0.1.0"
description = "A fast runner for table reasoning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.6,<4",
    "tqdm>=4.0",
    "transformers>=4.53.2,<6",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
vllm-legacy = ["vllm==0.10.0", "transformers>=4.53.2,<5"]
vllm-modern = ["vllm>=0.28,<0.29", "transformers>=5.5.3,<6"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 140
fix = true   # formatter/linter auto-fixes

[tool.ruff.lint]
select = ["E", "F", "I"] # E=pycodestyle, F=pyflakes, I=import sorting

[tool.uv]
# Keep the CUDA compiler/toolkit aligned with the CUDA 13.0 PyTorch runtime.
# Without this, uv may resolve a newer nvcc while leaving CUDA 13.0 headers in place.
override-dependencies = [
    # vLLM 0.28 pins post3; post4 fixes flashinfer.comm imports on Python 3.11.
    "flashinfer-python==0.6.16.post4",
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-cuda-crt==13.0.88",
    "nvidia-nvvm==13.0.88",
    "nvidia-cuda-cccl==13.0.85",
]
conflicts = [
    [
        { extra = "vllm-legacy" },
        { extra = "vllm-modern" },
    ],
]
