model:
  id: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  presets_path: "configs/models.yaml"
  # possible alternatives:
  # "meta-llama/Llama-2-70b-hf"
  # "meta-llama/Llama-2-70b-chat-hf"
  # "gpt2"
  # "mistralai/Mixtral-8x7B-v0.1"
  # "openai/gpt-oss-120b"
  # "openai/gpt-oss-20b"

  results_file: "./logs/results.jsonl"

dataset:
  loader: "huggingface"  # options: huggingface, json, disk
  name: "wikitablequestions"
  split: "train[:300]"
  trust_remote_code: true
  data_files: null
  path: null

run:
  max_examples: 1000

generation:
  use_constraints: true
  use_global_constraints: true
  use_chain_of_table: false

logging:
  enable_logging: true
  log_dir: "./logs/{model_log_dir}"
  save_readable_tables: false
  compress_logs: false
  log_format: "readable"
  max_table_chars: 10000

