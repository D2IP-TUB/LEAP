    - table: " ,Rank,Cyclist,Country\nrow 0,1,Alejandro,ESP\nrow 1,2,Alexandr,RUS\nrow 2,3,Davide,ITA\nrow 3,4,Paolo,ITA"
      question: "how many cyclists are from each country?"
