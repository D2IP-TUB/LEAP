terminology:
  operation_name: MCP tool name
  operation_call: complete MCP tools/call request
action_instruction: |
  Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Use an empty arguments object. Do not return prose, Markdown, or a function call.
argument_instructions:
  select_row: "Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Include every required tool argument. Do not return prose, Markdown, or a function call. Use only the 'select_row' tool."
  select_column: "Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Include every required tool argument. Do not return prose, Markdown, or a function call. Use only the 'select_column' tool."
  group_by: "Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Include every required tool argument. Do not return prose, Markdown, or a function call. Use only the 'group_by' tool."
  sort_by: "Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Include every required tool argument. Do not return prose, Markdown, or a function call. Use only the 'sort_by' tool."
  end: "Return only one official MCP JSON-RPC tools/call request. It must contain exactly jsonrpc, id, method, and params; method must be tools/call; params must contain exactly name and arguments. Include every required tool argument. Do not return prose, Markdown, or a function call. Use only the 'end' tool."
selection_shapes:
  select_row: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"select_row","arguments":{}}}'
  select_column: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"select_column","arguments":{}}}'
  group_by: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"group_by","arguments":{}}}'
  sort_by: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"sort_by","arguments":{}}}'
  end: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"end","arguments":{}}}'
operation_shapes:
  select_row: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"select_row","arguments":{"rows":["row 0","row 2"]}}}'
  select_column: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"select_column","arguments":{"columns":["Name","Points"]}}}'
  group_by: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"group_by","arguments":{"column":"Country"}}}'
  sort_by: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"sort_by","arguments":{"column":"Year","order":"desc"}}}'
  end: '{"jsonrpc":"2.0","id":"step","method":"tools/call","params":{"name":"end","arguments":{}}}'
