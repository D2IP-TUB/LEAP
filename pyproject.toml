[project]
name = "leap"
version = "0.1.0"
description = "A fast runner for table reasoning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.4.1",
    "tqdm>=4.0",
    "transformers>=4.53.2,<5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
vllm-legacy = ["vllm==0.10.0"]
vllm-modern = ["vllm>=0.12,<0.13"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 140
fix = true   # formatter/linter auto-fixes

[tool.ruff.lint]
select = ["E", "F", "I"] # E=pycodestyle, F=pyflakes, I=import sorting

[tool.uv]
conflicts = [
    [
        { extra = "vllm-legacy" },
        { extra = "vllm-modern" },
    ],
]
