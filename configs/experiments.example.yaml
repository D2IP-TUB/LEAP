base_config: configs/default.yaml
models:
  - Qwen/Qwen2.5-7B-Instruct
  - Qwen/Qwen2.5-32B-Instruct
  - meta-llama/Llama-4-Scout-17B-16E-Instruct
  - mistralai/Mistral-7B-Instruct-v0.2

# The runner expands all unique, supported combinations. Unconstrained jobs use
# xgrammar's modern runtime, legacy_state_machine + structured formats are
# omitted, and direct_query is emitted once per temperature mode because action constraints do not apply.
matrix:
  strategies:
    - iterative
    - cot
    - direct_query
  use_constraints:
    - false
    - true
  use_global_constraints:
    - false
    - true
  constraint_backends:
    # - legacy_state_machine
    - xgrammar
  output_formats:
    - function
    - json
    - mcp
  force_zero_temperature:
    - true

repeats: 3
max_examples: 500
output_root: results/experiments

# Run every answer extraction method on every strategy's final table.
extractors:
  - direct_query
  - nl2sql
  - nl2code
  - end2ender
  - cot_end2ender

# add_column is intentionally disabled for the entire matrix.
enabled_actions:
  - select_row
  - select_column
  - group_by
  - sort_by
  - end

# Optional. Defaults to the Python running the command, so `uv run` works without activation.
# python_executable: /path/to/python
