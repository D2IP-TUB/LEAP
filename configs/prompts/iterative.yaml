examples:
  - table: |
      ,date,division,league,regular season,playoffs,open cup,avg. attendance
      row 0,2001/01/02,2,usl a-league,"4th, western",quarterfinals,did not qualify,"7,169"
      row 1,2002/08/06,2,usl a-league,"2nd, pacific",1st round,did not qualify,"6,260"
      row 2,2005/03/24,2,usl first division,5th,quarterfinals,4th round,"6,028"
    question: "What was the last year when this team was part of the USL A-League?"
    answer: 'f_add_column("year", [2001, 2002, 2005]) -> f_select_row(["row 0", "row 1"]) -> f_select_column(["year", "league"]) -> f_sort_by("year", "desc") -> f_end()'
    answer_without_add_column: 'f_select_row(["row 0", "row 1"]) -> f_select_column(["date", "league"]) -> f_sort_by("date", "desc") -> f_end()'

  - table: |
      ,rank,lane,athlete,time
      row 0,1,6,manjeet kaur (ind),52.17
      row 1,2,5,olga tereshkova (kaz),51.86
      row 2,3,4,pinki pramanik (ind),53.06
    question: "How many athletes are from India?"
    answer: 'f_add_column("country of athletes", ["India", "Kazakhstan", "India"]) -> f_select_row(["row 0", "row 2"]) -> f_select_column(["athlete", "country of athletes"]) -> f_group_by("country of athletes") -> f_end()'
    answer_without_add_column: 'f_select_row(["row 0", "row 2"]) -> f_select_column(["athlete"]) -> f_group_by("athlete") -> f_end()'

  - table: |
      ,week,when,kickoff,opponent,results; final score,results; team record,game site,attendance
      row 0,1,"saturday, april 13",7:00 p.m.,at rhein fire,W 27-21,1-0,rheinstadion,"32,092"
      row 1,2,"saturday, april 20",7:00 p.m.,london monarchs,W 37-3,2-0,waldstadion,"34,186"
      row 2,3,"sunday, april 28",6:00 p.m.,at barcelona dragons,W 33-29,3-0,estadi olímpic de montjuïc,"17,503"
    question: "When was the competition with the highest points scored played?"
    answer: 'f_add_column("points scored", [27, 37, 33]) -> f_select_row([*]) -> f_select_column(["when", "points scored"]) -> f_sort_by("points scored", "desc") -> f_end()'
    answer_without_add_column: 'f_select_row([*]) -> f_select_column(["when", "results; final score"]) -> f_sort_by("results; final score", "desc") -> f_end()'

  - table: |
      ,iso/iec standard,status,wg
      row 0,iso/iec tr 19759,published (2005),20
      row 1,iso/iec 15288,published (2008),7
      row 2,iso/iec 12207,published (2011),7
    question: "How many standards were published in 2011?"
    answer: 'f_add_column("year", [2005, 2008, 2011]) -> f_select_row(["row 2"]) -> f_select_column(["year"]) -> f_group_by("year") -> f_end()'
    answer_without_add_column: 'f_select_row(["row 2"]) -> f_select_column(["status"]) -> f_group_by("status") -> f_end()'
