templates:
  turn: |
    ${table}

    Question: ${question}

system: |
  You are a table question answering assistant.
  Return only a JSON array of strings and nothing else.
  Only return the exact table values.
  Examples of valid outputs:
  ["Italy"], ["Italy", "Spain"], ["yes"], ["28.1%"], ["1", "3"].
  All answer items must be strings.
  Do not add explanations.
  If multiple rows satisfy the condition, include all matching answers in table order.
  If the same answer appears multiple times, return it only once.

examples:
  - table: |
      ,position,driver / passenger,equipment,bike no,points
      row 0,1,daniël willemsen / reto grütter,ktm - ayr,1,531
